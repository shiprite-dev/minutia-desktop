name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make test

  public-repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history for secrets
        run: ./gitleaks git --redact --verbose .
      - name: No internal plans, ticket numbers or private hostnames
        run: |
          ! git ls-files | grep -Ei '^(docs/|\.claude/|CLAUDE\.md$|AGENTS\.md$|tasks\.json$)|(^|/)(roadmap|backlog)[^/]*$'
          ! git grep -nIE '(^|[^A-Za-z0-9])MIN-[0-9]+|staging\.getminutia\.com|minutia-(ops|cloud)([^A-Za-z0-9-]|$)' -- . ':!.github/workflows/ci.yml'
